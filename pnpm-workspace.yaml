packages:
  - packages/*
  - packages/mcp/*
  # Private local tooling, never published. Kept out of `packages/` so it is not
  # subject to the publishable-package conventions.
  - dev/*

catalog:
  '@arethetypeswrong/cli': ^0.18.2
  '@changesets/cli': ^2.30.0
  '@graphql-codegen/cli': ^7.1.0
  '@graphql-codegen/client-preset': ^6.0.1
  '@graphql-typed-document-node/core': ^3.2.0
  '@modelcontextprotocol/ext-apps': ^1.7.5
  '@modelcontextprotocol/sdk': ^1.29.0
  '@tailwindcss/vite': ^4.3.3
  '@terrazzo/cli': 2.0.3
  '@terrazzo/plugin-css': 2.0.3
  '@types/json-schema': ^7.0.15
  '@types/lodash': 4.14.202
  '@types/node': ^24.0.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  '@types/semver': ^7.7.1
  colorjs.io: 0.6.1
  graphql: ^16.14.0
  husky: ^9.1.7
  lodash: ^4.18.1
  lru-cache: ^11.5.1
  oxfmt: ^0.54.0
  oxlint: ^1.53.0
  publint: ^0.3.18
  react: ^19.2.8
  react-dom: ^19.2.8
  semver: ^7.7.4
  syncpack: ^14.2.0
  tailwindcss: ^4.3.3
  tsdown: ^0.21.2
  turbo: ^2.9.14
  typescript: ^6.0.0
  vite: ^8.0.16
  vitest: ^4.0.18
  yaml: ^2.9.0
  zod: ^4.3.6

# Only install npm packages that are at least 3 days old
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@transcend-io/*'
  # Renovate security update: pnpm@10.34.4
  - pnpm@10.34.4
  # Renovate security update: undici@6.28.0
  - undici@6.28.0
  # Renovate security update: js-yaml@4.3.1
  - js-yaml@4.3.1

onlyBuiltDependencies:
  - esbuild
