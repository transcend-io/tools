packages:
  - packages/*
  - packages/mcp/*
  # Private local tooling, never published. Kept out of `packages/` so it is not
  # subject to the publishable-package conventions.
  - dev/*

# Only install npm packages that are at least 3 days old
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@transcend-io/*'
  # Renovate security update: csv-parse@7.0.2
  - csv-parse@7.0.2
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: vite@8.1.6
  - vite@8.1.6
  # Renovate security update: undici@6.29.1
  - undici@6.29.1
  # Renovate security update: zod@4.6.6
  - zod@4.6.6

onlyBuiltDependencies:
  - esbuild
