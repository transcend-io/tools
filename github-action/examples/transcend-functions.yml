# Example manifest for `transcend custom-functions push` and the
# transcend-io/tools/github-action composite action.
#
# Example use cases adapted from
# https://docs.transcend.io/docs/articles/rules-automation/webhook-user-guide#usecases
functions:
  # A GENERAL custom function: syncs a preference change from an external
  # system (e.g. Snowflake) into the Transcend Preference Store.
  - name: Update Preferences
    code: ./functions/update-preferences.ts
    description: Sync preference changes from an external system into the Preference Store
    # Test-run the signed code with this payload before pushing; the function
    # is rejected (and CI fails) when the test errors or exits non-zero.
    test-payload: ./test-payloads/update-preferences.json
    timeout-ms: 30000
    env:
      # Filled from --variables=transcendApiKey:... / the `variables` action
      # input, so the secrets never live in the repository.
      TRANSCEND_API_KEY: <<parameters.transcendApiKey>>
      TRANSCEND_PARTITION: <<parameters.transcendPartition>>

  # A DSR custom function: fulfills access/erasure requests against an
  # internal user-data API. The default export handles data-point operations;
  # the `enricher` export handles request enrichment.
  #
  # With no `data-silo-id`, the DSR integration (data silo) is created
  # automatically on the first push: it is created before the test run, the
  # function is linked to it when the test passes, and it is rolled back when
  # the test fails. Enable `update-manifest` to write the assigned `id` and
  # `data-silo-id` back into this file. The test payload never hardcodes a
  # silo ID — `extras.dataSilo` is injected automatically at test time.
  - name: DSR Lookup
    code: ./functions/dsr-lookup.ts
    type: DSR
    description: Fulfill access and erasure requests against the user warehouse
    test-payload: ./test-payloads/dsr-lookup.json
    # DATA_POINT (default) tests the default export; REQUEST_ENRICHER tests
    # the `enricher` export.
    test-payload-type: DATA_POINT
    allowed-hosts:
      - warehouse.internal.example.com
    timeout-ms: 30000
    env:
      WAREHOUSE_API_KEY: <<parameters.warehouseApiKey>>
