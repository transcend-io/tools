name: Publish

on:
  push:
    branches:
      - main
    # Only Version Packages commits write changelogs. This is a skip filter,
    # not a security control. The npm-publish environment is the control.
    paths:
      - 'packages/**/CHANGELOG.md'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Refuse to publish while changesets are pending
        run: |
          set -euo pipefail
          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print)"
          if [ -n "$pending" ]; then
            echo "::error::main has unreleased changesets. Merge the next Version Packages PR to publish."
            echo "$pending"
            exit 1
          fi

      - name: Bootstrap
        uses: ./.github/commands/bootstrap

      # Trusted publishing cannot create new npm packages. Without this, `changeset publish`
      # fails only the new package and still ships dependents that 404 on install.
      - name: Check every package already exists on npm
        run: pnpm check:new-packages

      - name: Check package consistency
        run: pnpm check:packages

      - name: Check dependency versions
        run: pnpm check:deps

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check exports
        run: pnpm check:exports

      - name: Check publish compatibility
        run: pnpm check:publint

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release_app
        with:
          app-id: ${{ vars.TRANSCEND_RELEASER_APP_ID }}
          private-key: ${{ secrets.TRANSCEND_RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.release_app.outputs.token }}
          HUSKY: '0'
