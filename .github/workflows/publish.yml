name: Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'changeset-release/main')
    runs-on: ubuntu-24.04-arm
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Publish the release PR tree, not the merge-queue commit that may
          # include newer changesets for the next release. Manual reruns use main.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/commands/bootstrap

      - name: Check package consistency
        run: pnpm check:packages

      - name: Check dependency versions
        run: pnpm check:deps

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check exports
        run: pnpm check:exports

      - name: Check publish compatibility
        run: pnpm check:publint

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: release_app
        with:
          app-id: ${{ vars.TRANSCEND_RELEASER_APP_ID }}
          private-key: ${{ secrets.TRANSCEND_RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.release_app.outputs.token }}

  # After a successful npm release (changeset-release/main merge or manual dispatch),
  # push MCP tool counts to docs.transcend.io and publish the drafts.
  # Soft-fail: docs sync must not mark the release workflow as failed.
  sync-mcp-docs:
    needs: publish
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Bootstrap
        uses: ./.github/commands/bootstrap

      - name: Build MCP packages
        run: pnpm exec turbo run build --filter="@transcend-io/mcp..."

      - name: Regenerate MCP docs
        run: pnpm --dir packages/mcp/mcp genfiles

      - name: Sync and publish tool counts to Sanity
        id: sync_sanity
        run: pnpm --dir packages/mcp/mcp sync:sanity -- --publish

      - name: Report docs sync result
        if: always()
        run: |
          if [ "${{ steps.sync_sanity.outcome }}" = "success" ]; then
            {
              echo "MCP docs synced and published to Sanity."
              echo ""
              echo "- https://docs.transcend.io/docs/articles/artificial-intelligence/mcp-guide"
              echo "- https://docs.transcend.io/docs/articles/artificial-intelligence/mcp-cursor-setup"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::warning title=MCP docs sync failed::npm publish succeeded, but Sanity docs sync failed. Run the sync manually (see job summary)."

          {
            echo "## MCP docs sync failed (release still succeeded)"
            echo ""
            echo "Packages were published to npm. Tool counts on docs.transcend.io were **not** updated."
            echo ""
            echo "### Fix manually"
            echo ""
            echo '```bash'
            echo 'export SANITY_API_TOKEN=...   # Editor token for project 1ievmmav'
            echo 'pnpm --dir packages/mcp/mcp genfiles'
            echo 'pnpm --dir packages/mcp/mcp sync:sanity -- --publish'
            echo '```'
            echo ""
            echo "Or re-run **Actions → Sync MCP docs to Sanity** with \`publish=true\`."
            echo ""
            echo "- https://docs.transcend.io/docs/articles/artificial-intelligence/mcp-guide"
            echo "- https://docs.transcend.io/docs/articles/artificial-intelligence/mcp-cursor-setup"
          } >> "$GITHUB_STEP_SUMMARY"
